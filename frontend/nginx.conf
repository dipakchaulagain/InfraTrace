server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers — safe, zero-risk hardening (no CSP: this app relies
    # on inline styles from Tailwind/Recharts and a Google Fonts stylesheet,
    # and getting a CSP wrong silently breaks rendering rather than erroring
    # loudly, so it's left as a deliberate follow-up rather than guessed at).
    #
    # NOTE: nginx's add_header does NOT merge across nesting levels — a
    # location block that defines its own add_header (below, for
    # Cache-Control) silently drops anything set at the server level instead
    # of inheriting it. So these are repeated in every location block rather
    # than declared once here.

    # SPA routing — send all non-file requests to index.html
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api to the backend container
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 5 min: /settings/backup/run and /settings/backup/restore block on
        # pg_dump/pg_restore for the request's duration; the default 60s cut
        # the connection before a real (if slow) backup could finish.
        proxy_read_timeout 300s;
        # Default 1m is too small for a DB backup file upload (restore-from-
        # another-machine flow).
        client_max_body_size 500m;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html (so new deploys are picked up immediately)
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

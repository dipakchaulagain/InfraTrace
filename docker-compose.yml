name: infratrace

# Bounds container log growth on disk. Docker's default json-file driver
# keeps logs forever otherwise, which fills the disk on a long-running
# production host. Applied identically to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infratrace}
      POSTGRES_USER: ${POSTGRES_USER:-infratrace_app}
      # NOTE: Postgres only applies POSTGRES_PASSWORD when initializing a
      # brand-new (empty) data volume. Changing it here later does NOT change
      # the password on an already-initialized volume — you'd also need to
      # run ALTER ROLE ... WITH PASSWORD inside the db container. Set this
      # before the very first `docker-compose up`, not after.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infratrace_app} -d ${POSTGRES_DB:-infratrace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # API server
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-infratrace_app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-infratrace}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@infratrace.local}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost}
      BACKUP_DIR: /app/backups
    # VMware/Nutanix connector credentials and sync-engine tuning are
    # deliberately not environment variables here — Admin -> Settings only.
    # Bind mount (not a named volume) so a host directory can be copied
    # wholesale to another machine for disaster recovery — see README.
    volumes:
      - ./backup:/app/backups
    logging: *default-logging
    # No published port: the frontend's Nginx already proxies /api/ (including
    # /api/docs) to this container over the internal Docker network — see
    # frontend/nginx.conf. Publishing 8000 directly would let traffic bypass
    # Nginx entirely, which matters because deps.py trusts the X-Forwarded-For
    # header set by that proxy; a client hitting this container straight
    # could otherwise spoof its own IP into the audit log / session records.
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: ["sh", "-c", "python3 wait_for_db.py && alembic upgrade head && python3 seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  # ---------------------------------------------------------------------------
  # Sync scheduler — same network as api/frontend (default bridge)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # Waits for api's healthcheck (only reachable after its own startup
      # command finishes migrations), instead of also running `alembic
      # upgrade head` here — running it from both services concurrently
      # raced on a fresh boot and could crash whichever container lost.
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-infratrace_app}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-infratrace}
      # Must match the api container's SECRET_KEY exactly — it's used to
      # decrypt connector passwords that api encrypted when they were saved
      # via Admin -> Settings. A mismatch here silently breaks sync auth.
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BACKUP_DIR: /app/backups
    # Same host folder as the api container — whichever process (scheduled
    # backup here, or manual "Backup now"/restore via the API) writes or
    # reads a file, both containers see the exact same files immediately.
    volumes:
      - ./backup:/app/backups
    logging: *default-logging
    command: ["sh", "-c", "python3 wait_for_db.py && python3 scheduler.py --interval-hours 4"]

  # ---------------------------------------------------------------------------
  # Frontend — Vite/React SPA served by Nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    logging: *default-logging

volumes:
  postgres_data:
    # Pinned to the volume created under the project's original name (vims) so
    # the rename to "infratrace" reuses the existing data instead of an empty volume.
    name: vims_postgres_data
